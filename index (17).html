<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شبكة المعارض</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#232323;--g:#22c55e;--g2:#16a34a;--t:#eaeaea;--m:#8a8a8a;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);padding:10px 12px}
h1{margin:0 0 8px;font-size:17px;color:var(--g)}
nav{display:flex;gap:6px;overflow-x:auto}
nav button,.tab{background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on,.tab.on{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
main{padding:12px;max-width:720px;margin:auto}
input,select,textarea{width:100%;background:#0f0f0f;color:var(--t);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--g)}
.btn{background:var(--g);color:#000;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:6px}
.btn.s{width:auto;padding:6px 10px;font-size:13px}.btn.d{background:var(--r);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs .tab{flex:1}
.nm{font-weight:700;color:var(--g)}.sub{color:var(--m);font-size:13px;margin-top:4px}
.sh{display:inline-block;background:#052e16;color:var(--g);border-radius:20px;padding:2px 10px;font-size:12px}
.note{border-right:3px solid var(--g);background:#0d1a11}
.x{background:none;border:0;color:var(--r);font-size:20px;cursor:pointer}
.pr{cursor:pointer;color:var(--m)}img.ph{width:64px;height:64px;object-fit:cover;border-radius:8px}
.hide{display:none}#menu{display:flex;flex-direction:column;gap:6px;margin-top:8px}#menu.hide{display:none}#menu button{background:var(--card);color:var(--t);border:1px solid var(--g);border-radius:10px;padding:11px;font-size:15px;text-align:right;cursor:pointer}#menu button.on{background:var(--g);color:#000;font-weight:700}img.big{width:100%;border-radius:10px;margin-top:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.empty{color:var(--m);text-align:center;padding:24px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<header><h1>شبكة المعارض</h1>
<nav id="nav"></nav><div id="menu" class="hide"></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const PASS="1234"; // باسورد حذف المعرض
const BR={moto:["دايون","هاوجيانج","Vigorey"],scooter:["دايون","هاوجيانج","Vigorey"],tri:["CMG","PNE","GALAXY","GMC","HAWA"]};
const KIND={moto:"موتوسيكل",scooter:"اسكوتر",tri:"تروسيكل"};
const COLS=["machines","notes","banned","installments","prices","names"];
const D={machines:[],notes:[],banned:[],installments:[],prices:[],names:[]};let menuOpen=false;let db=null,showroom="",page="show",sub="moto",q="",priv=false,show1="show";
try{showroom=localStorage.getItem("sr")||""}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SB_URL="https://ueeaqqwqucdwgcshoswu.supabase.co",SB_KEY="sb_publishable_0A10I-Bf15h-mbYRU074XQ_kXh_-SRk";
let sb=null;
async function add(c,o){o.ts=Date.now();o.showroom=o.showroom||showroom;
 if(!sb)return alert("مفيش اتصال بقاعدة البيانات");
 const {data,error}=await sb.from("sr_items").insert({col:c,data:o}).select().single();
 if(error)return alert("تعذر الحفظ");
 if(!D[c].some(x=>x.id===data.id)){D[c].push({...data.data,id:data.id});render()}}
async function del(c,id){if(!sb)return;
 const {error}=await sb.from("sr_items").delete().eq("id",id);
 if(error)return alert("تعذر الحذف");
 D[c]=D[c].filter(x=>x.id!==id);render()}
async function init(){
 if(SB_URL.startsWith("PASTE")){alert("لازم تحط رابط ومفتاح Supabase في أول الكود");return}
 try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){alert("تعذر الاتصال");return}
 const {data,error}=await sb.from("sr_items").select("*").order("created_at");
 if(error){alert("خطأ في قراءة البيانات");return}
 COLS.forEach(c=>D[c]=[]);data.forEach(r=>{if(D[r.col])D[r.col].push({...r.data,id:r.id})});render();
 sb.channel("sr").on("postgres_changes",{event:"*",schema:"public",table:"sr_items"},p=>{
  if(p.eventType==="INSERT"){const r=p.new;if(D[r.col]&&!D[r.col].some(x=>x.id===r.id)){D[r.col].push({...r.data,id:r.id});render()}}
  else if(p.eventType==="DELETE"){COLS.forEach(c=>D[c]=D[c].filter(x=>x.id!==p.old.id));render()}
 }).subscribe();
}
const NAV=[["show","عرض"],["store","مخزن"],["notes","ملاحظات"]];
const MENU=[["reg","تسجيل"],["banned","المحظورين"],["inst","ساحبين الأقساط"],["names","إضافة اسم موتوسيكل"],["prices","لستة الأسعار"],["me","معرضي"]];
function renderNav(){const inMenu=MENU.some(m=>m[0]===page);
 $("#nav").innerHTML=NAV.map(([k,t])=>`<button class="${page===k?"on":""}" data-p="${k}">${t}</button>`).join("")+`<button class="${menuOpen||inMenu?"on":""}" id="mb">☰</button>`;
 document.querySelectorAll("#nav button[data-p]").forEach(b=>b.onclick=()=>{page=b.dataset.p;q="";menuOpen=false;render()});
 $("#mb").onclick=()=>{menuOpen=!menuOpen;renderNav()};
 const mn=$("#menu");mn.className=menuOpen?"":"hide";
 mn.innerHTML=MENU.map(([k,t])=>`<button class="${page===k?"on":""}" data-m="${k}">${t}</button>`).join("");
 mn.querySelectorAll("button").forEach(b=>b.onclick=()=>{page=b.dataset.m;q="";menuOpen=false;render()})}
function search(){return `<input id="q" placeholder="🔍 بحث" value="${esc(q)}">`}
function bindSearch(){const i=$("#q");if(i)i.oninput=()=>{q=i.value;const p=i.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
const match=o=>!q||Object.values(o).join(" ").toLowerCase().includes(q.toLowerCase());
function list(isStore){
 const tri=sub==="tri";
 let a=D.machines.filter(m=>!!m.store===isStore&&(tri?m.kind==="tri":m.kind!=="tri")&&match(m));
 a.sort((x,y)=>(x.brand+x.model).localeCompare(y.brand+y.model,"ar"));
 return `<div class="tabs"><button class="tab ${!tri?"on":""}" data-s="moto">موتوسيكلات واسكوترات</button><button class="tab ${tri?"on":""}" data-s="tri">تروسيكلات</button></div>`+search()+
 (a.length?a.map(m=>`<div class="card"><div class="row"><span class="nm">${esc(m.brand)} ${esc(m.model)}</span><span class="sh">${esc(m.showroom)}</span></div>
 <div class="sub">${KIND[m.kind]||""} · ${esc(m.color)} · ${esc(m.cc)} cc${m.license?" · ترخيص "+esc(m.license):""}${isStore?" · الكمية: "+esc(m.count):""}</div>
 ${isStore&&m.shortage?`<div class="sub">النواقص: ${esc(m.shortage)}</div>`:""}
 <div class="sub pr" data-pr="${esc(m.price||"—")}">السعر: ••••</div></div>`).join(""):`<div class="empty">لا يوجد</div>`);
}
function bindList(){document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
 document.querySelectorAll(".pr").forEach(e=>e.onclick=()=>{e.textContent=e.textContent.includes("•")?"السعر: "+e.dataset.pr:"السعر: ••••"});bindSearch()}
function reg(){
 const k=window._k||"moto",st=window._st||false;
 const brands=brandsOf(k).map(b=>`<option>${esc(b)}</option>`).join("");
 const names=[...new Set(D.machines.map(m=>m.showroom))].filter(Boolean);
 return `<div class="card row"><span class="nm">🏬 ${esc(showroom)}</span><button class="x" id="delsr" title="حذف المعرض">×</button></div>
 <div class="card"><div class="tabs"><button class="tab ${!st?"on":""}" data-st="0">معرض</button><button class="tab ${st?"on":""}" data-st="1">مخزن</button></div>
 <select id="k">${Object.entries(KIND).map(([a,b])=>`<option value="${a}" ${a===k?"selected":""}>${b}</option>`).join("")}</select>
 <select id="b">${brands}</select><input id="m" list="ml" placeholder="اسم الموديل"><datalist id="ml">${mlist(k,BR[k][0])}</datalist><div class="g2"><input id="cc" placeholder="السعة (cc)" inputmode="numeric"><input id="c" placeholder="اللون"></div>
 <div class="g2"><input id="l" placeholder="موديل الترخيص"><input id="n" placeholder="العدد" inputmode="numeric" value="1"></div>
 <input id="p" placeholder="السعر (يظهر مخفي)" inputmode="numeric">
 ${st?`<input id="sh" placeholder="النواقص (كتابة)">`:""}
 <button class="btn" id="save">تسجيل المكنة</button></div>`;
}
function bindReg(){
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{window._st=b.dataset.st==="1";render()});
 $("#k").onchange=e=>{window._k=e.target.value;render()};
 $("#b").onchange=()=>{$("#ml").innerHTML=mlist($("#k").value,$("#b").value)};
 $("#delsr").onclick=async()=>{if(prompt("اكتب الباسورد لحذف المعرض")!==PASS)return alert("باسورد غلط");
  if(!confirm("حذف المعرض وكل مكنه فيه؟"))return;for(const m of D.machines.filter(x=>x.showroom===showroom))await del("machines",m.id);
  showroom="";try{localStorage.removeItem("sr")}catch(e){}render()};
 $("#save").onclick=async()=>{const m=$("#m").value.trim();if(!m)return alert("اكتب اسم الموديل");
  await add("machines",{kind:$("#k").value,brand:$("#b").value,model:m,cc:$("#cc").value,color:$("#c").value,license:$("#l").value,count:$("#n").value||"1",price:$("#p").value,store:!!window._st,shortage:window._st?$("#sh").value:""});
  ["m","cc","c","l","p"].forEach(i=>$("#"+i).value="");alert("تم التسجيل ✅")};
}
function notes(){
 return `<div class="card"><textarea id="nt" rows="3" placeholder="اكتب ملاحظة تظهر لكل المعارض"></textarea><button class="btn" id="addn">نشر الملاحظة</button></div>`+
 (D.notes.length?[...D.notes].sort((a,b)=>b.ts-a.ts).map(n=>`<div class="card note"><div class="row"><span class="nm">${esc(n.showroom)}</span>${n.showroom===showroom?`<button class="x" data-dn="${n.id}">×</button>`:""}</div><div>${esc(n.text)}</div></div>`).join(""):`<div class="empty">لا توجد ملاحظات</div>`);
}
function bindNotes(){$("#addn").onclick=async()=>{const t=$("#nt").value.trim();if(t)await add("notes",{text:t})};
 document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>del("notes",b.dataset.dn))}
function people(c){
 const a=D[c].filter(match).sort((x,y)=>(x.name||"").localeCompare(y.name||"","ar"));
 return `<div class="card"><input id="pn" placeholder="الاسم"><input id="pp" placeholder="رقم التليفون" inputmode="tel"><input id="pt" placeholder="ملاحظة">
 <input id="pf" type="file" accept="image/*"><button class="btn" id="addp">إضافة</button></div>`+search()+
 (a.length?a.map(p=>`<div class="card row"><div class="row" style="gap:10px;justify-content:flex-start">${p.photo?`<img class="ph" src="${p.photo}">`:""}<div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.phone)}</div><div class="sub">${esc(p.note)}</div><div class="sub">${esc(p.showroom)}</div></div></div>${p.showroom===showroom?`<button class="x" data-dp="${p.id}">×</button>`:""}</div>`).join(""):`<div class="empty">لا يوجد</div>`);
}
function shrink(f){return new Promise(r=>{if(!f)return r("");const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,320/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.onerror=()=>r("");i.src=u})}
function bindPeople(c){bindSearch();
 $("#addp").onclick=async()=>{const n=$("#pn").value.trim();if(!n)return alert("اكتب الاسم");
  await add(c,{name:n,phone:$("#pp").value,note:$("#pt").value,photo:await shrink($("#pf").files[0])})};
 document.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>del(c,b.dataset.dp))}
function mine(){
 const a=D.machines.filter(m=>m.showroom===showroom);
 return `<div class="card"><div class="nm">🏬 ${esc(showroom)}</div><div class="sub">${a.length} مكنة مسجلة</div></div>`+
 (a.length?a.map(m=>`<div class="card row"><div><div class="nm">${esc(m.brand)} ${esc(m.model)} ${m.store?"(مخزن)":""}</div><div class="sub">${esc(m.color)} · ${esc(m.cc)} cc · عدد ${esc(m.count)}</div></div><button class="x" data-dm="${m.id}">×</button></div>`).join(""):`<div class="empty">لا توجد مكن</div>`);
}
function brandsOf(k){return [...BR[k],...D.names.filter(n=>n.type===k).map(n=>n.brand)].filter((v,i,a)=>a.indexOf(v)===i)}
function mlist(k,b){return "";return [...new Set(D.names.filter(n=>n.type===k&&n.brand===b).map(n=>n.model))].sort((x,y)=>x.localeCompare(y,"ar")).map(m=>`<option value="${esc(m)}">`).join("")}
function namesPage(){
 const k=window._nk||"moto",a=D.names.filter(match).sort((x,y)=>(x.brand+x.model).localeCompare(y.brand+y.model,"ar"));
 return `<div class="card"><div class="nm">إضافة اسم موتوسيكل</div><div class="sub">اختر النوع واكتب اسم الماركة، وهتضاف جنب الماركات الأساسية في اختيارات التسجيل ولستة الأسعار لكل المعارض.</div>
 <select id="nk">${Object.entries(KIND).map(([x,y])=>`<option value="${x}" ${x===k?"selected":""}>${y}</option>`).join("")}</select>
 <input id="nn" placeholder="اسم الماركة الجديدة"><button class="btn" id="addnm">إضافة الاسم</button></div>`+search()+
 (a.length?a.map(n=>`<div class="card row"><div><span class="nm">${esc(n.brand)}</span><div class="sub">${KIND[n.type]||""} · ${esc(n.showroom)}</div></div>${n.showroom===showroom?`<button class="x" data-dn2="${n.id}">×</button>`:""}</div>`).join(""):`<div class="empty">لا توجد أسماء</div>`);
}
function bindNames(){bindSearch();
 $("#nk").onchange=e=>{window._nk=e.target.value;render()};
 $("#addnm").onclick=async()=>{const m=$("#nn").value.trim();if(!m)return alert("اكتب الاسم");
  if(D.names.some(n=>n.type===$("#nk").value&&n.brand.toLowerCase()===m.toLowerCase())||BR[$("#nk").value].some(b=>b.toLowerCase()===m.toLowerCase()))return alert("الاسم موجود");
  await add("names",{type:$("#nk").value,brand:m});$("#nn").value=""};
 document.querySelectorAll("[data-dn2]").forEach(b=>b.onclick=()=>confirm("حذف؟")&&del("names",b.dataset.dn2))}
function shrinkBig(f){return new Promise(r=>{if(!f)return r("");const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.onerror=()=>r("");i.src=URL.createObjectURL(f)})}
function prices(){
 const k=window._pk||"moto",ph=D.prices.filter(p=>p.kind==="photo"),it=D.prices.filter(p=>p.kind==="item"&&match(p)).sort((x,y)=>(x.brand+x.model).localeCompare(y.brand+y.model,"ar"));
 return `<div class="card"><div class="nm">رفع صورة لستة الأسعار</div><input id="pf" type="file" accept="image/*"><button class="btn" id="upl">رفع الصورة</button>${ph.map(p=>`<div><img class="big" src="${p.photo}">${p.showroom===showroom?`<button class="btn s d" data-dpr="${p.id}">حذف الصورة</button>`:""}</div>`).join("")}</div>
 <div class="card"><div class="nm">تسجيل موتوسيكل بأسعاره</div><select id="pk">${Object.entries(KIND).map(([a,b])=>`<option value="${a}" ${a===k?"selected":""}>${b}</option>`).join("")}</select>
 <select id="pb">${brandsOf(k).map(b=>`<option>${esc(b)}</option>`).join("")}</select><input id="pm" list="pml" placeholder="اسم الموديل"><datalist id="pml">${mlist(k,BR[k][0])}</datalist>
 <div class="g3"><input id="p1" placeholder="سعر 1" inputmode="numeric"><input id="p2" placeholder="سعر 2" inputmode="numeric"><input id="p3" placeholder="سعر 3" inputmode="numeric"></div>
 <button class="btn" id="addpr">إضافة للستة</button></div>`+search()+
 (it.length?it.map(p=>`<div class="card"><div class="row"><span class="nm">${esc(p.brand)} ${esc(p.model)}</span><span class="sh">${KIND[p.type]||""}</span>${p.showroom===showroom?`<button class="x" data-dpr="${p.id}">×</button>`:""}</div><div class="g3 sub"><span>${esc(p.p1)||"—"}</span><span>${esc(p.p2)||"—"}</span><span>${esc(p.p3)||"—"}</span></div></div>`).join(""):`<div class="empty">لا يوجد</div>`);
}
function bindPrices(){bindSearch();
 $("#pk").onchange=e=>{window._pk=e.target.value;render()};
 $("#pb").onchange=()=>{$("#pml").innerHTML=mlist($("#pk").value,$("#pb").value)};
 $("#upl").onclick=async()=>{const f=$("#pf").files[0];if(!f)return alert("اختر صورة");const d=await shrinkBig(f);if(d)await add("prices",{kind:"photo",photo:d})};
 $("#addpr").onclick=async()=>{const m=$("#pm").value.trim();if(!m)return alert("اكتب اسم الموديل");await add("prices",{kind:"item",type:$("#pk").value,brand:$("#pb").value,model:m,p1:$("#p1").value,p2:$("#p2").value,p3:$("#p3").value})};
 document.querySelectorAll("[data-dpr]").forEach(b=>b.onclick=()=>confirm("حذف؟")&&del("prices",b.dataset.dpr))}
function render(){
 if(!showroom){renderNav();$("#app").innerHTML=`<div class="card"><div class="nm">اسم معرضك</div><div class="sub">كل معرض مسؤول عن مكنه، واسمه بيظهر على كل مكنة تسجلها.</div><input id="sn" placeholder="اسم المعرض"><button class="btn" id="go">دخول</button></div>`;
  $("#go").onclick=()=>{const v=$("#sn").value.trim();if(!v)return;showroom=v;try{localStorage.setItem("sr",v)}catch(e){}render()};return}
 renderNav();const A=$("#app");
 if(page==="show"){const nt=D.notes.length?[...D.notes].sort((a,b)=>b.ts-a.ts)[0]:null;
  A.innerHTML=(nt?`<div class="card note"><b>📌 ${esc(nt.showroom)}:</b> ${esc(nt.text)}</div>`:"")+list(false);bindList()}
 else if(page==="store"){A.innerHTML=list(true);bindList()}
 else if(page==="reg"){A.innerHTML=reg();bindReg()}
 else if(page==="notes"){A.innerHTML=notes();bindNotes()}
 else if(page==="banned"){A.innerHTML=people("banned");bindPeople("banned")}
 else if(page==="inst"){A.innerHTML=people("installments");bindPeople("installments")}
 else if(page==="names"){A.innerHTML=namesPage();bindNames()}
 else if(page==="prices"){A.innerHTML=prices();bindPrices()}
 else{A.innerHTML=mine();document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>confirm("حذف؟")&&del("machines",b.dataset.dm))}
}
render();init();
</script></body></html>
